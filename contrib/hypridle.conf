# Install as ~/.config/hypr/hypridle.conf, then: systemctl --user enable --now hypridle.service
# Omarchy's shell already does screen-off and lock; this file only feeds the ledger.
general {
    before_sleep_cmd = tagwerk idle
    after_sleep_cmd = tagwerk active
    ignore_dbus_inhibit = false
}

listener {
    timeout = 150
    on-timeout = tagwerk idle
    on-resume = tagwerk active
}
